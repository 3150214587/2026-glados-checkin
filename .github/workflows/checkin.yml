name: GLaDOS 2026 Checkin

on:
  schedule:
    # UTC+8 上午 09:07–11:52 的候选时间；每天仅选中一个时间执行签到。
    # 分开声明以便即使排队延迟，也能用 event.schedule 识别原始候选时间。
    # 保留同日排队延迟的事件；Turnstile 期间按上游默认只读核对。
    - cron: '7 1 * * *'
    - cron: '22 1 * * *'
    - cron: '37 1 * * *'
    - cron: '52 1 * * *'
    - cron: '7 2 * * *'
    - cron: '22 2 * * *'
    - cron: '37 2 * * *'
    - cron: '52 2 * * *'
    - cron: '7 3 * * *'
    - cron: '22 3 * * *'
    - cron: '37 3 * * *'
    - cron: '52 3 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 本次运行的账号
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - EDGE
          - CHROME
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean
      points_audit:
        description: 只读诊断时查询积分流水，仅输出日期和积分数值
        required: false
        default: false
        type: boolean
      notify_status_only:
        description: 只读核对并推送（需要配置通知渠道）
        required: false
        default: false
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  morning-selection:
    name: Select daily morning slot
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Select morning slot
        id: select
        run: python morning_schedule.py
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}

  checkin:
    needs: morning-selection
    name: Checkin (${{ matrix.account }})
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(inputs.account != '' && inputs.account != 'ALL' && format('["{0}"]', inputs.account) || vars.GLADOS_ACCOUNTS || '["EDGE"]') }}
    if: needs.morning-selection.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets[format('GLADOS_COOKIE_{0}', matrix.account)] }}
          # Must match the browser that created the current gld:sess.
          # Prefer the repository Variable; accept a same-named Secret for compatibility.
          GLADOS_USER_AGENT: ${{ vars[format('GLADOS_USER_AGENT_{0}', matrix.account)] || secrets[format('GLADOS_USER_AGENT_{0}', matrix.account)] || vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          # Follow upstream's read-only default until actual check-in is verified.
          # Use diagnostic output because this deployment has no push credentials.
          CHECKIN_DIAGNOSTIC_ONLY: ${{ (inputs.diagnose_only || ((github.event_name == 'schedule' || inputs.dispatch_source == 'external') && (vars[format('ALLOW_SCHEDULED_CHECKIN_{0}', matrix.account)] || vars.ALLOW_SCHEDULED_CHECKIN || 'false') != 'true')) && 'true' || 'false' }}
          CHECKIN_POINTS_AUDIT: ${{ (inputs.points_audit || github.event_name == 'schedule' || inputs.dispatch_source == 'external') && 'true' || 'false' }}
          CHECKIN_NOTIFY_STATUS_ONLY: ${{ inputs.notify_status_only && 'true' || 'false' }}
          GLADOS_BROWSER_CHECKIN: '0'
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'off' }}
          CHECKIN_MAX_ATTEMPTS: '1'
          CHECKIN_RETRY_DELAY_SECONDS: '60'

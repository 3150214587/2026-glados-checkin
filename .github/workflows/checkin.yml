name: GLaDOS 2026 Checkin

on:
  schedule:
    # 北京时间 09:30（UTC 01:30）。Turnstile 时期：定时与外部触发的运行自动降级为
    # 只读状态推送（CHECKIN_NOTIFY_STATUS_ONLY=true），不再尝试签到，避免必然的
    # 失败推送；机房 IP 无法通过 Turnstile。如官方撤下验证，把仓库变量
    # ALLOW_SCHEDULED_CHECKIN 设为 true 即恢复完整签到。
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 本次运行的账号
        required: false
        default: ALL
        type: choice
        options:
          - ALL
          - EDGE
          - CHROME
      dispatch_source:
        description: 手动运行请选择 manual；外部定时器可不填（默认按 external）
        required: false
        default: external
        type: choice
        options:
          - manual
          - external
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean
      notify_status_only:
        description: 只读取账号状态与积分流水并发送通知（如 PushPlus），不发起签到请求、不自动兑换
        required: false
        default: false
        type: boolean

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    if: github.event_name == 'schedule' || inputs.dispatch_source == 'manual' || inputs.dispatch_source == 'external'
    name: Checkin (${{ matrix.account }})
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(inputs.account != '' && inputs.account != 'ALL' && format('["{0}"]', inputs.account) || vars.GLADOS_ACCOUNTS || '["EDGE"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 8
        env:
          GLADOS_COOKIE: ${{ secrets[format('GLADOS_COOKIE_{0}', matrix.account)] }}
          # Must match the browser that created the current gld:sess.
          # Prefer the repository Variable; accept a same-named Secret for compatibility.
          GLADOS_USER_AGENT: ${{ vars[format('GLADOS_USER_AGENT_{0}', matrix.account)] || secrets[format('GLADOS_USER_AGENT_{0}', matrix.account)] || vars.GLADOS_USER_AGENT || secrets.GLADOS_USER_AGENT }}
          # Keep the upstream read-only default unless this specific account is enabled.
          CHECKIN_DIAGNOSTIC_ONLY: ${{ (inputs.diagnose_only || ((github.event_name == 'schedule' || inputs.dispatch_source == 'external') && (vars[format('ALLOW_SCHEDULED_CHECKIN_{0}', matrix.account)] || vars.ALLOW_SCHEDULED_CHECKIN || 'false') != 'true')) && 'true' || 'false' }}
          CHECKIN_NOTIFY_STATUS_ONLY: ${{ inputs.notify_status_only && 'true' || 'false' }}
          CHECKIN_MAX_ATTEMPTS: '1'
          GLADOS_BROWSER_CHECKIN: '0'
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'fail_only' }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN || 'off' }}
          CHECKIN_RETRY_DELAY_SECONDS: '60'
